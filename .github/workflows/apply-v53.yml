name: Expand corlualtus v5.3 release

on:
  push:
    branches:
      - release/corlualtus-v5.3
    paths:
      - '.github/workflows/apply-v53.yml'
      - '.release/**'

permissions:
  contents: write

jobs:
  expand:
    if: ${{ !contains(github.event.head_commit.message, '[v5.3-expanded]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: release/corlualtus-v5.3
          fetch-depth: 0

      - name: Rebuild v5.3 source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .release/v53-web.b64.* | tr -d '\n\r' | base64 -d > /tmp/v53-web.tar.xz
          xz -t /tmp/v53-web.tar.xz
          rm -rf /tmp/v53-web
          mkdir -p /tmp/v53-web
          tar -xJf /tmp/v53-web.tar.xz -C /tmp/v53-web
          test -f /tmp/v53-web/package.json
          test -f /tmp/v53-web/public/vehicle/pratico_E_rozetli_disk.svg

      - name: Replace web source, keep native shells
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.release/' \
            --exclude='android/' \
            --exclude='ios/' \
            --exclude='mobile-shell/' \
            --exclude='capacitor.config.ts' \
            /tmp/v53-web/ ./
          rm -f package-lock.json tsconfig.tsbuildinfo

      - name: Commit expanded v5.3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "yaaertu codeR"
          git config user.email "ertucaymaz@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: [v5.3-expanded] sales-ready corlualtus map and courier UX"
          git push origin HEAD:release/corlualtus-v5.3
