name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
